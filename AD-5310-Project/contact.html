<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cashtronix</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="styles/main.css">
    <script type="text/javascript" src="scripts/main.js" defer></script>
</head>

<body>

    <header>
        <h1>Contact Us</h1>
    </header>

    <nav class="navbar navbar-expand-lg bg-body-tertiary">
        <div class="container-fluid">
            <span class="navbar-brand">Cashtronix</span>

            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>

            <div class="collapse navbar-collapse" id="navbarNav">
                <div class="navbar-nav">
                    <a class="nav-link" href="index.html">Home</a>
                    <a class="nav-link" href="sell.html">Sell Your Device</a>
                    <a class="nav-link" href="contact.html">Contact</a>
                </div>
            </div>
        </div>
    </nav>

    <main class="container mt-4">
        <h2>Have a Question?</h2>

        <p>Send us a message and we will get back to you.</p>
        <figure>
            <img src="images/trade.jpg">
        </figure>

        <form name="contact" class="col-md-6">

            <label for="name">Name:</label><br>
            <input type="text" class="form-control" name="name" id="name">

            <br><br>

            <label for="email">Email:</label><br>
            <input type="email" class="form-control" name="email" id="email">

            <br><br>

            <label for="message">Message:</label><br>
            <textarea name="message" id="message" rows="10" cols="30" class="form-control"></textarea>

            <br><br>

            <input type="submit" name="submit" value="Submit" class="btn btn-primary">

        </form>

    </main>

    <footer>
        <p>Cashtronix</p>
    </footer>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
