<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cashtronix</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="styles/main.css">
    <script type="text/javascript" src="scripts/main.js" defer></script>
</head>

<body>

    <header>
        <h1>Sell Your Device</h1>
    </header>

    <nav class="navbar navbar-expand-lg bg-body-tertiary">
        <div class="container-fluid">
            <span class="navbar-brand">Cashtronix</span>

            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>

            <div class="collapse navbar-collapse" id="navbarNav">
                <div class="navbar-nav">
                    <a class="nav-link" href="index.html">Home</a>
                    <a class="nav-link" href="sell.html">Sell Your Device</a>
                    <a class="nav-link" href="contact.html">Contact</a>
                </div>
            </div>
        </div>
    </nav>

    <main class="container mt-4">
        <h2>Get a Quote</h2>

        <p>Tell us about your device to get a quote.</p>
        <figure>
            <img src="images/cashtronix.jpg">
        </figure>

        <form name="device" class="col-md-6">

            <label for="device">Device:</label><br>

            <select name="device" id="device" class="form-select">
                <option value="phone">Phone</option>
                <option value="laptop">Laptop</option>
                <option value="tablet">Tablet</option>
                <option value="console">Game Console</option>
            </select>

            <br><br>

            <label for="brand">Brand:</label><br>
            <input type="text" name="brand" id="brand" class="form-control">

            <br><br>

            <label for="model">Model:</label><br>
            <input type="text" name="model" id="model" class="form-control">

            <br><br>

            <label for="condition">Condition:</label><br>

            <select name="condition" id="condition" class="form-select">
                <option value="excellent">Excellent</option>
                <option value="good">Good</option>
                <option value="fair">Fair</option>
            </select>

            <br><br>

            <input type="submit" name="submit" value="Get Quote" class="btn btn-primary">

        </form>

    </main>

    <footer>
        <p>Cashtronix</p>
    </footer>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
